          </div>
          <label class="anon"><input type="checkbox" id="feedAnon" checked /> 匿名留言（不公开称呼）</label>
          <button type="submit">提交留言</button>
          <p class="feed-status" id="feedStatus"></p>
        </form>
      </div>
      <div class="reveal">
        <div class="feed-count" id="feedCount"></div>
        <div class="msg-list" id="msgList"></div>
      </div>
